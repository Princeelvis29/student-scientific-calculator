workflows:
  android-ci:
    name: Android CI - Tests and APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Flutter environment
        script: |
          flutter --version
          flutter doctor -v
      - name: Get packages
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze
      - name: Run tests
        script: |
          flutter test
      - name: Build debug APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - flutter_drive.log

  android-release:
    name: Android Release - Signed APK and AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - arktech_upload_keystore
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Test
        script: |
          flutter test
      - name: Configure Android signing
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build release APK
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER
      - name: Build release AAB
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/**/outputs/**/mapping.txt

  android-play-internal:
    name: Android Play Internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - arktech_upload_keystore
      groups:
        - google_play_credentials
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Test
        script: |
          flutter test
      - name: Configure Android signing
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build signed AAB
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
